version: 2

# Dogu keeps Dependabot version updates disabled to avoid routine dependency
# churn. GitHub Dependabot alerts/security features remain managed from the
# repository security settings and should still be used for real vulnerabilities.
updates:
  - package-ecosystem: "npm"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  - package-ecosystem: "cargo"
    directory: "/src-tauri"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
