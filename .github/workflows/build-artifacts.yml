name: Release Artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify project version metadata
        id: version
        shell: python
        run: |
          import json
          import os
          import pathlib
          import tomllib

          cargo_toml = pathlib.Path("src-tauri/Cargo.toml")
          package_json = pathlib.Path("package.json")

          cargo_version = tomllib.loads(cargo_toml.read_text(encoding="utf-8"))["package"]["version"]
          package_version = json.loads(package_json.read_text(encoding="utf-8"))["version"]

          if cargo_version != package_version:
              raise SystemExit(
                  f"Version mismatch: Cargo.toml={cargo_version!r} package.json={package_version!r}"
              )

          ref = os.environ.get("GITHUB_REF", "")
          if ref.startswith("refs/tags/"):
              tag = ref.removeprefix("refs/tags/")
              expected = f"v{cargo_version}"
              if tag != expected:
                  raise SystemExit(f"Tag {tag!r} does not match project version {expected!r}")

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"version={cargo_version}\n")

  windows:
    runs-on: windows-latest
    needs: verify-version
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Windows artifact
        run: python tools/release.py build-windows
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: dogu-windows-x64-${{ needs.verify-version.outputs.version }}
          path: dist/dogu-windows-x64-*-setup.exe

  linux-deb:
    runs-on: ubuntu-latest
    needs: verify-version
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 \
            build-essential \
            curl \
            wget \
            file \
            libfuse2t64 \
            libsmbclient \
            libsmbclient-dev \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Build Linux DEB artifact
        run: python3 tools/release.py build-linux-deb
      - name: Upload Linux DEB
        uses: actions/upload-artifact@v4
        with:
          name: dogu-linux-deb-${{ needs.verify-version.outputs.version }}
          path: dist/dogu-linux-x86_64-*.deb

  linux-flatpak:
    runs-on: ubuntu-latest
    needs: verify-version
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install native and Flatpak dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 \
            build-essential \
            curl \
            wget \
            file \
            libsmbclient \
            libsmbclient-dev \
            pkg-config \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            flatpak \
            flatpak-builder
      - name: Build Linux Flatpak artifact
        run: python3 tools/release.py build-linux-flatpak
      - name: Upload Linux Flatpak
        uses: actions/upload-artifact@v4
        with:
          name: dogu-linux-flatpak-${{ needs.verify-version.outputs.version }}
          path: dist/dogu-linux-x86_64-*.flatpak

  checksums:
    runs-on: ubuntu-latest
    needs:
      - verify-version
      - windows
      - linux-deb
      - linux-flatpak
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: dogu-*
          merge-multiple: true
      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd release-artifacts
          sha256sum * > SHA256SUMS.txt
      - name: Upload checksums
        uses: actions/upload-artifact@v4
        with:
          name: dogu-checksums-${{ needs.verify-version.outputs.version }}
          path: release-artifacts/SHA256SUMS.txt

  publish-release:
    runs-on: ubuntu-latest
    needs:
      - verify-version
      - windows
      - linux-deb
      - linux-flatpak
      - checksums
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          pattern: dogu-*
          merge-multiple: true
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            release-artifacts/dogu-windows-x64-*-setup.exe
            release-artifacts/dogu-linux-x86_64-*.deb
            release-artifacts/dogu-linux-x86_64-*.flatpak
            release-artifacts/SHA256SUMS.txt
