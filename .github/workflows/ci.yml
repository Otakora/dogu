name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend checks
        run: npm run check

  rust-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run Rust checks
        working-directory: src-tauri
        run: cargo check
      - name: Run focused Rust tests
        working-directory: src-tauri
        run: cargo test --lib remote::tests -- --nocapture

  rust-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            pkg-config \
            libtirpc-dev \
            libgnutls28-dev \
            libldap2-dev \
            libjansson-dev \
            libparse-yapp-perl \
            libacl1-dev \
            libpam0g-dev \
            libcups2-dev \
            libsasl2-dev \
            libunistring-dev \
            libbsd-dev \
            libcap-dev \
            libkeyutils-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf
      - name: Run Rust checks
        working-directory: src-tauri
        run: cargo check
      - name: Run focused Rust tests
        working-directory: src-tauri
        run: cargo test --lib remote::tests -- --nocapture
