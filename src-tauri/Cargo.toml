[package]
name = "dogu"
version = "0.2.5-beta.2"
description = "A practical desktop file workbench for local files, remotes and queued operations."
authors = ["Otakora"]
edition = "2021"
license = "GPL-2.0-or-later"
homepage = "https://github.com/Otakora/dogu"
repository = "https://github.com/Otakora/dogu"

[lib]
name = "dogu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["clock"] }
remotefs = "0.3.1"
remotefs-ftp = { version = "0.4.0", features = ["rustls-ring"] }
remotefs-smb = "0.3.1"
remotefs-ssh = { version = "0.8.5", default-features = false, features = ["libssh2", "find"] }
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ssh2 = "0.9"
suppaftp = { version = "9.0.0", features = ["rustls-ring", "deprecated"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
webpki-roots = "1"
walkdir = "2"
# Default features minus `lzma`/`xz`: those pull native lzma-sys, which clashes
# with nod's liblzma-sys (both `links = "lzma"`). nod owns lzma so it can read
# every RVZ; Dogu only writes Stored/Deflated zips, and 7-Zip covers exotic
# archives, so dropping the internal LZMA-zip reader is safe.
zip = { version = "2", default-features = false, features = ["aes-crypto", "bzip2", "deflate", "deflate64", "time", "zstd"] }
sysinfo = { version = "0.32", default-features = false, features = ["disk"] }
dirs = "5"
portable-pty = "0.8"
regex = "1"
flate2 = "1"
xdvdfs = { version = "0.8.3", features = ["sync"] }
nod = "=2.0.0-alpha.9"
tauri-plugin-updater = "2"
