[package]
name = "dogu"
version = "0.2.2"
description = "ROM manager desktop app"
authors = ["wind"]
edition = "2021"

[lib]
name = "dogu_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["clock"] }
remotefs = "0.3.1"
remotefs-ftp = { version = "0.4.0", features = ["rustls-ring"] }
remotefs-smb = "0.3.1"
remotefs-ssh = { version = "0.8.5", default-features = false, features = ["libssh2", "find"] }
rustls = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ssh2 = "0.9"
suppaftp = { version = "9.0.0", features = ["rustls-ring", "deprecated"] }
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
webpki-roots = "1"
walkdir = "2"
zip = "2"
sysinfo = { version = "0.32", default-features = false, features = ["disk"] }
dirs = "5"
portable-pty = "0.8"
regex = "1"
